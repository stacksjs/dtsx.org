name: Benchmark lab
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: benchmarks
      - name: Install checksum-pinned native release
        run: bun setup-zig.ts
        working-directory: benchmarks
      - name: Clear the previous snapshot from the measurement output
        run: bun -e "const fs = await import('node:fs/promises'); await fs.unlink('../public/benchmarks/results.json')"
        working-directory: benchmarks
      - name: Run sequential qualified benchmarks
        run: bun run.ts --require-all
        working-directory: benchmarks
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results-${{ matrix.os }}
          path: public/benchmarks/results.json
          retention-days: 90
