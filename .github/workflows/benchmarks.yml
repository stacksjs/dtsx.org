name: Benchmark lab
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: benchmarks
      - name: Run sequential qualified benchmarks
        run: bun run.ts
        working-directory: benchmarks
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-linux
          path: public/benchmarks/results.json
          retention-days: 90
